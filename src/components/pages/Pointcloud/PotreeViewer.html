<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Potree Viewer</title>
  <link rel="stylesheet" href="/src/components/pages/PointCloud/build/potree/potree.css" />
  <link rel="stylesheet" href="/src/libs/openlayers3/ol.css" />
  <link rel="stylesheet" href="/src/libs/spectrum/spectrum.css" />
  <link rel="stylesheet" href="/src/libs/jstree/themes/mixed/style.css" />
  <link rel="stylesheet" href="/src/libs/jquery-ui/jquery-ui.min.css">

  <script src="/src/libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="/src/libs/spectrum/spectrum.js"></script>
  <script src="/src/libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="/src/libs/other/BinaryHeap.js"></script>
  <script src="/src/libs/tween/tween.min.js"></script>
  <script src="/src/libs/d3/d3.js"></script>
  <script src="/src/libs/proj4/proj4.js"></script>
  <script src="/src/libs/openlayers3/ol.js"></script>
  <script src="/src/libs/i18next/i18next.js"></script>
  <script src="/src/libs/jstree/jstree.js"></script>
  <script src="/src/components/pages/PointCloud/build/potree/potree.js"></script>
  <script src="/src/libs/plasio/js/laslaz.js"></script>

  <script type="module">
    import * as THREE from "three";

    const viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    viewer.setPointBudget(500_000);
    viewer.loadSettingsFromURL();

    viewer.loadGUI(() => {
      viewer.setLanguage('en');
      $("#menu_tools").next().show();
      $("#menu_scene").next().show();
    });

    Potree.loadPointCloud("/public/models/pointcloud/test04/metadata.json", "Tòa nhà", (e) => {
      const scene = viewer.scene;
      scene.addPointCloud(e.pointcloud);
      const material = e.pointcloud.material;
      material.size = 1;
      material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      viewer.fitToScreen();
    });

    const directional = new THREE.DirectionalLight(0xffffff, 1.0);
    directional.position.set(10, 10, 10);
    directional.lookAt(0, 0, 0);
    const ambient = new THREE.AmbientLight(0x555555);
    viewer.scene.scene.add(directional);
    viewer.scene.scene.add(ambient);
  </script>
</head>
<body>
  <div class="potree_container" style="position:absolute;width:100%;height:100%;">
    <div id="potree_render_area"></div>
    <div id="potree_sidebar_container"></div>
  </div>
</body>

</html>
